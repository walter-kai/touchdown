worker_processes 1;

events {
    worker_connections 1024;
}

http {
        upstream backend {
            server 127.0.0.1:3001; # Backend server
        }

    upstream nextjs {
        server 127.0.0.1:3000; # Next.js server
    }

    server {
        listen 443;
        server_name touchdown-882290629693.us-central1.run.app;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; 
            script-src 'self' 'unsafe-eval' 'unsafe-inline' https://telegram.org https://accounts.google.com https://apis.google.com https://www.gstatic.com; 
            object-src 'none'; 
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
            img-src 'self' data: https: https://lh3.googleusercontent.com; 
            font-src 'self' data: https: https://fonts.gstatic.com; 
            connect-src 'self' https: wss: https://accounts.google.com https://apis.google.com https://www.googleapis.com https://www.gstatic.com https://site.api.espn.com https://site.web.api.espn.com https://cdn.espn.com https://sports.core.api.espn.com; 
            frame-src 'self' https://accounts.google.com https://apis.google.com https://t.me; 
            frame-ancestors 'none'; 
            base-uri 'self'; 
            form-action 'self';" always;

        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        # Proxy /auth/* to Express backend
        location /auth/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Proxy /api/* to Express backend
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Proxy everything else to Next.js
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

    }
}
